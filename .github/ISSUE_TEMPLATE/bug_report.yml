name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select two PDFs in Explorer
        2. Right-click → ClickMorph → Merge
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ClickMorph version
      description: Output of `cm --version`
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Sample files or logs
      description: Attach a file that reproduces the problem if you can. Don't share files with private information.
